# _deploy-env.yml: Reusable workflow that deploys one image to one EC2 via SSM, runs health checks, auto-rolls back on failure, and notifies SNS.

name: Deploy Environment

on:
  workflow_call:
    inputs:
      env_name: { required: true, type: string }
      instance_id: { required: true, type: string }
      image_uri: { required: true, type: string }
      image_tag: { required: true, type: string }
    secrets:
      AWS_DEPLOY_ROLE_ARN: { required: true }
      SNS_TOPIC_ARN: { required: true }

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  APP_NAME: task-app
  LOG_GROUP: /cicd-pipeline/${{ inputs.env_name }}/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current (previous) image
        id: prev
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ inputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cat /opt/app/.current_image 2>/dev/null || echo none"]' \
            --query "Command.CommandId" --output text)
          sleep 8
          PREV=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ inputs.instance_id }}" \
            --query "StandardOutputContent" --output text | tr -d '\n' | xargs)
          echo "previous=${PREV:-none}" >> $GITHUB_OUTPUT
          echo "Previous image: ${PREV:-none}"

      - name: Deploy new image
        id: deploy
        run: |
          cat > /tmp/deploy.sh <<'SH'
          #!/bin/bash
          set -e
          IMAGE_URI="$1"; ENV_NAME="$2"; VERSION="$3"; LOG_GROUP="$4"
          cd /opt/app
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${IMAGE_URI%%/*}
          export IMAGE_URI ENV_NAME VERSION LOG_GROUP AWS_REGION=us-east-1
          cat > docker-compose.yml <<'YML'
          version: "3.8"
          services:
            app:
              image: ${IMAGE_URI}
              container_name: task-app
              restart: unless-stopped
              ports: ["3000:3000"]
              environment:
                - APP_ENV=${ENV_NAME}
                - APP_VERSION=${VERSION}
              logging:
                driver: awslogs
                options:
                  awslogs-region: ${AWS_REGION}
                  awslogs-group: ${LOG_GROUP}
                  awslogs-stream: app
          YML
          docker compose down || true
          docker compose up -d
          echo "$IMAGE_URI" > .current_image
          SH
          chmod +x /tmp/deploy.sh
          # Upload script via base64 in SSM (simplest for demo)
          B64=$(base64 -w0 /tmp/deploy.sh)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ inputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64 | base64 -d > /tmp/deploy.sh\",\"chmod +x /tmp/deploy.sh\",\"/tmp/deploy.sh ${{ inputs.image_uri }} ${{ inputs.env_name }} ${{ inputs.image_tag }} $LOG_GROUP\"]" \
            --query "Command.CommandId" --output text)
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT
          # Poll
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ inputs.instance_id }}" \
              --query "Status" --output text)
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] && exit 1
            sleep 5
          done
          exit 1

      - name: Health check
        id: health
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "${{ inputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          for i in {1..10}; do
            if curl -sf "http://$IP:3000/health" | tee /tmp/health.json; then
              ENV=$(jq -r .env /tmp/health.json)
              [ "$ENV" = "${{ inputs.env_name }}" ] && echo "health ok" && exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.previous != 'none'
        run: |
          echo "Rolling back to ${{ steps.prev.outputs.previous }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ inputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/app && export IMAGE_URI=${{ steps.prev.outputs.previous }} ENV_NAME=${{ inputs.env_name }} VERSION=rollback LOG_GROUP=$LOG_GROUP AWS_REGION=us-east-1 && docker compose down && docker compose up -d && echo ${{ steps.prev.outputs.previous }} > .current_image\"]" \
            --query "Command.CommandId" --output text)
          sleep 15
          IP=$(aws ec2 describe-instances --instance-ids "${{ inputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          curl -sf "http://$IP:3000/health" && echo "rollback verified"

      - name: SNS success (prod only)
        if: success() && inputs.env_name == 'prod'
        run: |
          aws sns publish --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Production deploy success" \
            --message "Image ${{ inputs.image_uri }} deployed to prod successfully."

      - name: SNS rollback success
        if: failure() && steps.prev.outputs.previous != 'none'
        run: |
          aws sns publish --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Deployment failed — rollback OK (${{ inputs.env_name }})" \
            --message "Deploy to ${{ inputs.env_name }} failed. Rolled back to ${{ steps.prev.outputs.previous }}."
