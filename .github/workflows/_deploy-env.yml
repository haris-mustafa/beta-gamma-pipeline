
# _deploy-env.yml: Reusable deployment workflow with SSM, health checks, rollback and SNS notifications.

name: Deploy Environment

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      instance_id:
        required: true
        type: string
      image_uri:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true
      SNS_TOPIC_ARN:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  APP_NAME: task-app
  LOG_GROUP: /cicd-pipeline/${{ inputs.env_name }}/app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. AWS Authentication ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- 2. Get Previous Image ----------
      - name: Get current image
        id: prev
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ inputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cat /opt/app/.current_image 2>/dev/null || echo none"]' \
            --query "Command.CommandId" \
            --output text)

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ inputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo Pending)

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              echo "Failed to retrieve previous image"
              exit 1
            fi

            sleep 2
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Timed out retrieving previous image"
            exit 1
          fi

          PREV=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ inputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text | tr -d '\r\n' | xargs)

          echo "previous=${PREV:-none}" >> "$GITHUB_OUTPUT"
          echo "Previous image: ${PREV:-none}"

      # ---------- 3. Deploy New Image ----------
      - name: Deploy new image
        id: deploy
        run: |
          cat > /tmp/deploy.sh <<'SH'
          #!/bin/bash
          set -e

          IMAGE_URI="$1"
          ENV_NAME="$2"
          VERSION="$3"
          LOG_GROUP="$4"

          cd /opt/app

          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${IMAGE_URI%%/*}"

          export IMAGE_URI ENV_NAME VERSION LOG_GROUP
          export AWS_REGION=us-east-1

          cat > docker-compose.yml <<'YML'
          services:
            app:
              image: ${IMAGE_URI}
              container_name: task-app
              restart: unless-stopped
              ports:
                - "3000:3000"
              environment:
                APP_ENV: ${ENV_NAME}
                APP_VERSION: ${VERSION}
              logging:
                driver: awslogs
                options:
                  awslogs-region: ${AWS_REGION}
                  awslogs-group: ${LOG_GROUP}
                  awslogs-stream: app
          YML

          docker compose down || true
          docker compose up -d

          echo "$IMAGE_URI" > .current_image
          SH

          chmod +x /tmp/deploy.sh

          B64=$(base64 -w0 /tmp/deploy.sh)

          REMOTE_CMD="echo '$B64' | base64 -d > /tmp/deploy.sh && chmod +x /tmp/deploy.sh && /tmp/deploy.sh '${{ inputs.image_uri }}' '${{ inputs.env_name }}' '${{ inputs.image_tag }}' '${{ env.LOG_GROUP }}'"

          PARAMS=$(jq -cn --arg cmd "$REMOTE_CMD" '{commands: [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ inputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          # Wait for deployment
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ inputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo Pending)

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful"
              exit 0
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ inputs.instance_id }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out"
          exit 1

      # ---------- 4. Health Check ----------
      - name: Health check
        id: health
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids "${{ inputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          for i in {1..10}; do
            if curl -sf "http://$IP:3000/health" -o /tmp/health.json; then
              ENV=$(jq -r '.env // empty' /tmp/health.json)

              if [ "$ENV" = "${{ inputs.env_name }}" ]; then
                echo "Health check passed"
                exit 0
              fi
            fi

            sleep 6
          done

          echo "Health check failed"
          exit 1

      # ---------- 5. Automatic Rollback ----------
      - name: Rollback on failure
        id: rollback
        if: ${{ failure() && steps.prev.outputs.previous != 'none' }}
        run: |
          PREVIOUS="${{ steps.prev.outputs.previous }}"

          echo "Rolling back to $PREVIOUS"

          cat > /tmp/rollback.sh <<'SH'
          #!/bin/bash
          set -e

          IMAGE_URI="$1"
          ENV_NAME="$2"
          LOG_GROUP="$3"

          cd /opt/app

          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${IMAGE_URI%%/*}"

          export IMAGE_URI
          export ENV_NAME
          export VERSION=rollback
          export LOG_GROUP
          export AWS_REGION=us-east-1

          docker compose down
          docker compose up -d

          echo "$IMAGE_URI" > .current_image
          SH

          chmod +x /tmp/rollback.sh

          B64=$(base64 -w0 /tmp/rollback.sh)

          REMOTE_CMD="echo '$B64' | base64 -d > /tmp/rollback.sh && chmod +x /tmp/rollback.sh && /tmp/rollback.sh '$PREVIOUS' '${{ inputs.env_name }}' '${{ env.LOG_GROUP }}'"

          PARAMS=$(jq -cn --arg cmd "$REMOTE_CMD" '{commands: [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ inputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          # Wait for rollback
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ inputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo Pending)

            if [ "$STATUS" = "Success" ]; then
              echo "Rollback command successful"
              exit 0
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              echo "Rollback failed"
              exit 1
            fi

            sleep 5
          done

          echo "Rollback timed out"
          exit 1

      # ---------- 6. Verify Rollback ----------
      - name: Verify rollback
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids "${{ inputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          for i in {1..10}; do
            if curl -sf "http://$IP:3000/health"; then
              echo "Rollback health check passed"
              exit 0
            fi

            sleep 6
          done

          echo "Rollback health check failed"
          exit 1

      # ---------- 7. SNS Success Notification ----------
      - name: SNS success
        if: ${{ success() && inputs.env_name == 'prod' }}
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Production deploy success" \
            --message "Image ${{ inputs.image_uri }} deployed to production successfully."

      # ---------- 8. SNS Rollback Notification ----------
      - name: SNS rollback notification
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_TOPIC_ARN }}" \
            --subject "Deployment failed - rollback OK (${{ inputs.env_name }})" \
            --message "Deployment to ${{ inputs.env_name }} failed. Rolled back to ${{ steps.prev.outputs.previous }}."
